# wheelhouse.config.yml
# =============================================================================
# AGOS-owned Wheelhouse configuration.
#
# Owner is derived from github.repository_owner at workflow runtime.
# Repo names below are intentionally repo names only, not owner/repo slugs.
#
# This fork starts in a conservative AGOS pilot posture:
# - current pilot watches only firstmate-gui-agnostic
# - acting paths stay conservative: automatic CI approval disabled
# - Claude/LLM features disabled
# - issue scanning disabled until the pilot explicitly enables it
# - merge thank-you side effects disabled
# =============================================================================

repos:
  - name: firstmate-gui-agnostic
    compliance_check: "PR must be raised via no-mistakes"
    test_check_patterns: ["Behavior tests"]
    merge_method: squash
    auto_approve_ci: false
    auto_triage: false
    auto_triage_issues: false
    thank_on_merge: false

# Optional GitHub login allowed to drive decisions in addition to the repo owner.
# Leave blank until the captain explicitly names another trusted maintainer.
maintainer: ""

# Keep all Claude-powered advisory features off for the first AGOS pilot.
# Wheelhouse #2 and #4 can choose where advisory triage becomes useful.
auto_triage: false
auto_triage_issues: false
nl_decisions: false

# Do not let the scheduled scan flood the Wheelhouse fork with FirstMate issue
# cards before the AGOS issue-state adapter and pilot are ready.
card_issues: false

# Never auto-approve fork CI during the initial AGOS setup.
# A later issue may turn this on per repo after the safety posture is verified.
auto_approve_ci: false

# Avoid contributor side-effect comments during AGOS setup.
thank_on_merge: false
